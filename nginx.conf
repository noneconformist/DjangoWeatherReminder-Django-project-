upstream django {
    server app:8080; # Redirect requests to the app service to port 8000 (For debug mode to make app:8000 для runserver)
}

server {
    listen 80 default_server;
    server_name _;

    # Redirect all other requests to Django (gunicorn)docker-compose down
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route for statics
    location /static/ {
        alias /usr/share/nginx/html/static/;
    }
}