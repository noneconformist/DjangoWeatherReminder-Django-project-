image: docker:27-cli

services:
  - docker:27-dind

stages:
  - lint
  - test

variables:
  DOCKER_TLS_CERTDIR: ""
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

before_script:
  - apk add --no-cache py3-pip python3-dev build-base
  - python3 -m venv .venv
  - . .venv/bin/activate
  - pip install uv
  - uv pip install --group dev
  # Runtime create .env
  - echo "POSTGRES_DB=docker_db" >> .env
  - echo "POSTGRES_USER=docker_user" >> .env
  - echo "POSTGRES_PASSWORD=docker_password" >> .env
  - echo "POSTGRES_PORT_HOST=5433" >> .env
  - echo "STATIC=/home/docker_user/app/staticfiles" >> .env
  - echo "PG_DATA=/var/lib/postgresql/data" >> .env
  - echo "SECRET_KEY=dev-secret-key-for-ci" >> .env
  - echo "API_OPEN_WEATHER_KEY=575a31d8f2ee72ba92af623a1617033c" >> .env

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev")'

lint:
  stage: lint
  script:
    - ruff check .
    - ruff format --check .
    - pre-commit run --all-files
  allow_failure: false

test:
  stage: test
  script:
    - docker compose -f docker-compose.yml -p $CI_PIPELINE_ID up --build -d
    - docker compose -p $CI_PIPELINE_ID run --rm app uv run python manage.py migrate --no-input
    - docker compose -p $CI_PIPELINE_ID run --rm app uv run pytest --disable-warnings --maxfail=1
    - docker compose -p $CI_PIPELINE_ID down
  after_script:
    - - docker network prune -f
  allow_failure: false

