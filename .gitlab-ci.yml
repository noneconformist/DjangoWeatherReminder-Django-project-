image: docker:27-cli

services:
  - docker:27-dind

stages:
  - lint
  - test

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_TLS_CERTDIR: ""
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POSTGRES_DB: docker_db
  POSTGRES_USER: docker_user
  POSTGRES_PASSWORD: docker_password
  POSTGRES_PORT_HOST: 5433
  STATIC: /home/docker_user/app/staticfiles
  PG_DATA: /var/lib/postgresql/data

cache:
  paths:
    - .cache/pip

before_script:
  - apk add --no-cache py3-pip python3-dev build-base
  - python3 -m venv .venv
  - . .venv/bin/activate
  - pip install uv
  - uv pip install --group dev
  # Runtime create .env
  - echo "POSTGRES_DB=docker_db" >> .env
  - echo "POSTGRES_USER=docker_user" >> .env
  - echo "POSTGRES_PASSWORD=docker_password" >> .env
  - echo "POSTGRES_PORT_HOST=5433" >> .env
  - echo "STATIC=/home/docker_user/app/staticfiles" >> .env
  - echo "PG_DATA=/var/lib/postgresql/data" >> .env

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev")'

lint:
  stage: lint
  script:
    - pre-commit run --all-files
  allow_failure: false

test:
  stage: test
  script:
    - docker compose -f docker-compose.yml up --build --abort-on-container-exit test
  allow_failure: false
