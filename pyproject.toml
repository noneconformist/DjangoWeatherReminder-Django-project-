[project]
name = "task-17-basic-application-dwr"
version = "0.1.0"
description = "Weather notification in the subscribed city via email, webhook"
readme = "README.md"
requires-python = "==3.11.6"
dependencies = [
    "django>=5.2.6",
    "psycopg[binary, pool]>=3.2.1",
    "python-dotenv>=1.2.1",
    "gunicorn>=23.0.0",
    "psycopg-binary==3.2.12",
    "djangorestframework==3.16.1",
    "djangorestframework-simplejwt==5.5.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.13.2",
    "pytest>=8.4.2",
    "pytest-django>=4.11.1",
]

# Ruff settings
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["F401"]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "uv.lock",
    ".python-version",
    ".gitignore",
    ".dockerignore",
    "requirements.txt",
]
extend-exclude = ["migrations"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_weather_reminder.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
